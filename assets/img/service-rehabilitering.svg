<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrasjon av rehabilitering – oppgradering av eksisterende bolig">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16222f"/><stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="330" fill="url(#bgR)"/>
  <g stroke="#31465a" stroke-width="1" opacity="0.25">
    <path d="M0 66H480M0 132H480M0 198H480M0 264H480M80 0V330M160 0V330M240 0V330M320 0V330M400 0V330"/>
  </g>
  <line x1="0" y1="272" x2="480" y2="272" stroke="#2b3a4a" stroke-width="2" opacity="0.7"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- house outline -->
    <g stroke="#cdd6df" stroke-width="3.5">
      <path d="M120 272 V150 L240 78 L360 150 V272"/>
      <path d="M120 150 L240 78 L360 150"/>
    </g>
    <!-- refreshed panels on one half (accent) -->
    <g stroke="#c08a3e" stroke-width="3">
      <rect x="150" y="185" width="42" height="60"/>
      <rect x="205" y="185" width="42" height="60"/>
      <path d="M240 78 L360 150" stroke-width="4"/>
    </g>
    <!-- renew / refresh arrows -->
    <g stroke="#c08a3e" stroke-width="3.5" opacity="0.95">
      <path d="M300 120 a34 34 0 1 0 12 -22"/>
      <path d="M296 92 L312 96 L306 112"/>
    </g>
  </g>
</svg>

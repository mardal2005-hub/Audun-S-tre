<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plassholder for prosjektbilde – bolig under oppføring">
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2735"/><stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#rl)"/>
  <g stroke="#33475a" stroke-width="1" opacity="0.22">
    <path d="M0 80H800M0 160H800M0 240H800M0 320H800M0 400H800M0 480H800M0 560H800M100 0V640M200 0V640M300 0V640M400 0V640M500 0V640M600 0V640M700 0V640"/>
  </g>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#2b3a4a" stroke-width="2" opacity="0.6"/>
  <g fill="none" stroke="#54677b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- house -->
    <path d="M180 500 V250 L400 120 L620 250 V500"/>
    <path d="M180 250 L400 120 L620 250"/>
    <!-- studs -->
    <g stroke-width="2" opacity="0.7">
      <path d="M230 500V270M290 500V255M350 500V245M410 500V245M470 500V255M530 500V270M590 500V285"/>
      <path d="M180 340H620M180 420H620"/>
    </g>
    <!-- window frames in accent -->
    <g stroke="#c08a3e" stroke-width="3" opacity="0.85">
      <rect x="250" y="300" width="70" height="90"/>
      <rect x="470" y="300" width="70" height="90"/>
    </g>
  </g>
</svg>

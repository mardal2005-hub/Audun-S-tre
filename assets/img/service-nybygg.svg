    <g stroke="#c08a3e" stroke-width="3.5">
      <path d="M110 148 L215 72 L320 148" opacity="0.0"/>
      <path d="M215 72 L215 90"/>
      <path d="M270 108 V80 H292 V126"/>
    </g>
    <!-- small secondary building -->

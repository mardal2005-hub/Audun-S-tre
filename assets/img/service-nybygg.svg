<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrasjon av nybygg – ferdig bolig fra grunnen av">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16222f"/><stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="330" fill="url(#bgN)"/>
  <g stroke="#31465a" stroke-width="1" opacity="0.25">
    <path d="M0 66H480M0 132H480M0 198H480M0 264H480M80 0V330M160 0V330M240 0V330M320 0V330M400 0V330"/>
  </g>
  <line x1="0" y1="270" x2="480" y2="270" stroke="#2b3a4a" stroke-width="2" opacity="0.7"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

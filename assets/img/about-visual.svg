<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plassholder – her kan det legges inn bilde av Audun eller teamet">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2836"/><stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="avglow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c08a3e" stop-opacity="0.20"/><stop offset="1" stop-color="#c08a3e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#av)"/>
  <g stroke="#33475a" stroke-width="1" opacity="0.18">
    <path d="M0 100H640M0 200H640M0 300H640M0 400H640M0 500H640M0 600H640M0 700H640M80 0V800M160 0V800M240 0V800M320 0V800M400 0V800M480 0V800M560 0V800"/>
  </g>
  <rect x="0" y="420" width="640" height="380" fill="url(#avglow)"/>
  <!-- builder silhouette with hard hat, line-art -->
  <g fill="none" stroke="#5c6f83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- hard hat -->
    <path d="M250 300 q70 -70 140 0" />
    <path d="M235 300 H405" stroke="#c08a3e" stroke-width="5"/>
    <path d="M320 235 V262"/>
    <!-- head -->
    <path d="M285 305 q0 60 35 60 q35 0 35 -60"/>
    <!-- shoulders / torso -->
    <path d="M235 520 q10 -120 85 -155 q75 35 85 155"/>
    <!-- arm holding a level/board -->
    <path d="M235 470 L185 560" />
    <path d="M405 470 L455 560"/>
  </g>
  <!-- ground line -->
  <line x1="0" y1="640" x2="640" y2="640" stroke="#2b3a4a" stroke-width="2" opacity="0.6"/>
</svg>
